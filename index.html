<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Register System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><strong>Student Register System</strong></header>
    <p>Add, Edit and Delete of student data</p>

    <div class="container">

        <form id="RegistrationForm">
            <input type="text" id="name" placeholder="Student Name">
            <input type="number" id="studentId" placeholder="Student ID">
            <input type="text" id="email" placeholder="Email Id">
            <input type="number" id="contactNumber" placeholder="Contact No.">
             <button id="submit-btn">Registered</button>

        </form>

        <section>
            <h2>Registred Students</h2>
            <table>
                <thead>
                    <tr class="studentData">
                        <th>Name</th>
                        <th>ID</th>
                        <th>Email Id</th>
                        <th>Contact No.</th>
                    </tr>
                </thead>
                 <tbody id="studentList"></tbody>
            </table>

           

        </section>

    </div>



    <script src="script.js"></script>
</body>

</html>
